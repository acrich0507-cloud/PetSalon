<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PetSalon LIFF Entry</title>
    <style>
      :root {
        --bg: #f6f3ee;
        --card: #ffffff;
        --text: #1d1d1f;
        --muted: #5a5a5f;
        --accent: #cc5a2b;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at 20% 20%, #fff8e8, var(--bg));
        font-family: "Noto Sans TC", "Microsoft JhengHei", sans-serif;
        color: var(--text);
      }

      .card {
        width: min(92vw, 560px);
        background: var(--card);
        border-radius: 16px;
        padding: 24px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      }

      h1 {
        margin: 0 0 12px;
        font-size: 1.4rem;
      }

      p {
        margin: 0 0 8px;
        color: var(--muted);
      }

      pre {
        margin: 16px 0 0;
        padding: 12px;
        border-radius: 12px;
        background: #f5f5f7;
        font-size: 0.88rem;
        overflow-x: auto;
      }
    </style>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  </head>
  <body>
    <main class="card">
      <h1>LIFF Auto Detect</h1>
      <p id="status">Starting...</p>
      <pre id="result"></pre>
    </main>

    <script src="./app-config.js"></script>
    <script type="module" src="./liff-bootstrap.js"></script>
  </body>
</html>
